# https://home.miot-spec.com/spec/dmaker.fan.p39

esphome:
  name: tower-fan-p39
  friendly_name: Xiaomi Smart Tower Fan
rtl87xx:
  board: bw15
  framework:
    version: 0.0.0
    source: https://github.com/prokoma/libretiny#55aacc8
external_components:
  - source: github://dhewg/esphome-miot@main
logger:
  baud_rate: 0
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
uart:
  tx_pin: GPIO14
  rx_pin: GPIO13
  baud_rate: 115200

miot:
  id: miot_main
fan:
  - platform: miot
    name: Fan
    id: tower_fan
    state:
      miot_siid: 2
      miot_piid: 1
    speed:
      miot_siid: 2
      miot_piid: 11
      min_value: 1
      max_value: 100
select:
  - platform: miot
    name: Mode
    icon: mdi:leaf
    miot_siid: 2
    miot_piid: 4
    options:
      0: Direct Breeze
      1: Natural Breeze
      2: Sleep Mode
  - platform: miot
    name: Oscillation Angle
    icon: mdi:angle-obtuse
    miot_siid: 2
    miot_piid: 6
    options:
      30: "30°"
      60: "60°"
      90: "90°"
      120: "120°"
      150: "150°"
number:
  - platform: template
    name: Fan Speed
    icon: mdi:fan
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 1
    update_interval: 1s
    lambda: |-
      return id(tower_fan).state ? id(tower_fan).speed : 0;
    set_action:
      - lambda: |-
          if (x == 0) {
            id(tower_fan).turn_off().perform();
          } else {
            id(tower_fan).turn_on().set_speed(static_cast<int>(x)).perform();
          }
  - platform: miot
    name: Fan Level
    icon: mdi:fan-chevron-up
    miot_siid: 2
    miot_piid: 2
    min_value: 1
    max_value: 4
    step: 1
  - platform: miot
    name: Off Delay
    id: off_delay
    icon: mdi:clock-outline
    device_class: duration
    miot_siid: 2
    miot_piid: 8
    unit_of_measurement: min
    min_value: 0
    max_value: 480
    step: 1
switch:
  - platform: miot
    name: Oscillation
    id: oscillation
    miot_siid: 2
    miot_piid: 5
  - platform: miot
    name: Notification Sounds
    icon: mdi:volume-high
    entity_category: config
    miot_siid: 2
    miot_piid: 7
  - platform: miot
    name: Indicator Lights
    icon: mdi:lightbulb
    entity_category: config
    miot_siid: 2
    miot_piid: 9
  - platform: miot
    name: Child Lock
    icon: mdi:lock
    entity_category: config
    miot_siid: 3
    miot_piid: 1
button:
  - platform: miot
    name: Toggle Power
    icon: mdi:power-cycle
    miot_siid: 2
    miot_aiid: 1
  - platform: template
    name: Adjust Left
    icon: mdi:rotate-right
    on_press:
      - lambda: id(miot_main).queue_command("set_properties 2 10 2");
  - platform: template
    name: Adjust Right
    icon: mdi:rotate-left
    on_press:
      - lambda: id(miot_main).queue_command("set_properties 2 10 1");
  - platform: miot
    name: Toggle Mode
    icon: mdi:leaf
    miot_siid: 4
    miot_aiid: 2
  - platform: miot
    name: Toggle Speed
    icon: mdi:fan
    miot_siid: 4
    miot_aiid: 1
  - platform: template
    name: Toggle Oscillation
    icon: mdi:swap-horizontal
    on_press:
      - switch.toggle: oscillation
  - platform: template
    name: Toggle Off Delay
    icon: mdi:timer-outline
    on_press:
      - lambda: |-
          if (id(off_delay).has_state()) {
            auto call = id(off_delay).make_call();
            const float minutes = id(off_delay).state;
            const float next = minutes < 240 ? (static_cast<int>(minutes) / 60 + 1) * 60 : 0;
            call.set_value(next);
            call.perform();
          }
