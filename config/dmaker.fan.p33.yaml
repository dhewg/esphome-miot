# https://home.miot-spec.com/spec/dmaker.fan.p33

external_components:
  source: github://dhewg/esphome-miot@main

esphome:
  name: standing-fan-pro
  friendly_name: Smart Standing Fan 2 Pro
  comment: Xiaomi Mi Smart Standing Fan 2 (dmaker.fan.p33)
  project:
    name: "dhewg.esphome-miot"
    version: "dmaker.fan.p33"

esp8266:
  board: esp_wroom_02

logger:
  level: DEBUG
  # Important: Disable UART1 logging to avoid hardware errors on main UART0
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  services:
    - service: mcu_command
      variables:
        command: string
      then:
        - lambda: 'id(miot_main).queue_command(command);'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret wifi_ap_password

captive_portal:

uart:
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 115200

miot:
  id: miot_main

fan:
  - platform: "miot"
    name: "Fan"
    id: standing_fan
    state:
      miot_siid: 2
      miot_piid: 1
    speed:
      miot_siid: 2
      miot_piid: 6
      min_value: 1
      max_value: 100
    oscillating:
      miot_siid: 2
      miot_piid: 4

switch:
  - platform: template
    name: "Oscillation"
    id: oscillation
    icon: "mdi:swap-horizontal"
    lambda: return id(standing_fan).oscillating;
    turn_on_action:
      - lambda: id(standing_fan).make_call().set_oscillating(true).perform();
    turn_off_action:
      - lambda: id(standing_fan).make_call().set_oscillating(false).perform();
  - platform: "miot"
    miot_siid: 4
    miot_piid: 1
    name: "Indicator Lights"
    icon: "mdi:lightbulb"
    entity_category: config
  - platform: "miot"
    miot_siid: 5
    miot_piid: 1
    name: "Notification Sounds"
    icon: "mdi:volume-high"
    entity_category: config
  - platform: "miot"
    miot_siid: 7
    miot_piid: 1
    name: "Child Lock"
    icon: "mdi:lock"
    entity_category: config

select:
  - platform: "miot"
    id: "mode"
    miot_siid: 2
    miot_piid: 3
    name: "Mode"
    icon: "mdi:leaf"
    options:
      0: "Direct Breeze"
      1: "Natural Breeze"
  - platform: "miot"
    miot_siid: 2
    miot_piid: 5
    name: "Oscillation Angle"
    icon: "mdi:angle-obtuse"
    options:
      30: "30°"
      60: "60°"
      90: "90°"
      120: "120°"
      140: "140°"

number:
  - platform: template
    name: Fan Speed
    icon: mdi:fan
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 1
    update_interval: 1s
    lambda: |-
      return id(standing_fan).state ? id(standing_fan).speed : 0;
    set_action:
      - script.execute:
          id: set_fan_speed
          speed: !lambda return static_cast<int>(x);
  - platform: "miot"
    miot_siid: 2
    miot_piid: 2
    name: "Fan Level"
    icon: "mdi:fan-chevron-up"
    min_value: 1
    max_value: 4
    step: 1
  - platform: "miot"
    miot_siid: 3
    miot_piid: 1
    name: "Off Delay"

    id: off_delay
    icon: "mdi:clock-outline"
    unit_of_measurement: "min"
    device_class: duration
    min_value: 0
    max_value: 480
    step: 1

button:
  - platform: "miot"
    miot_siid: 2
    miot_aiid: 1
    name: "Toggle Power"
    icon: "mdi:power-cycle"
  - platform: "template"
    name: "Adjust Left"
    icon: "mdi:pan-left"
    on_press:
      - lambda: id(miot_main).queue_command("set_properties 6 1 1");
  - platform: "template"
    name: "Adjust Right"
    icon: "mdi:pan-right"
    on_press:
      - lambda: id(miot_main).queue_command("set_properties 6 1 2");
  - platform: "miot"
    name: "Toggle Mode"
    icon: "mdi:leaf"
    miot_siid: 3
    miot_aiid: 1
  - platform: "miot"
    name: "Toggle Speed"
    icon: "mdi:fan"
    miot_siid: 3
    miot_aiid: 2
  - platform: template
    name: "Toggle Oscillation"
    icon: "mdi:swap-horizontal"
    on_press:
      - switch.toggle: oscillation
  - platform: template
    name: "Toggle Off Delay"
    icon: "mdi:timer-outline"
    on_press:
      - lambda: |-
          if (id(off_delay).has_state()) {
            auto call = id(off_delay).make_call();
            const float minutes = id(off_delay).state;
            const float next = minutes < 240 ? (static_cast<int>(minutes) / 60 + 1) * 60 : 0;
            call.set_value(next);
            call.perform();
          }

script:
  - id: set_fan_speed
    mode: restart
    parameters:
      speed: int
    then:
      - if:
          condition:
            lambda: return speed == 0;
          then:
            - fan.turn_off: standing_fan
          else:
            - if:
                condition:
                  fan.is_off: standing_fan
                then:
                  - fan.turn_on: standing_fan
                  - wait_until:
                      condition:
                        fan.is_on: standing_fan
                      timeout: 3s
            - if:
                condition:
                  fan.is_on: standing_fan
                then:
                  - lambda: id(standing_fan).make_call().set_speed(speed).perform();
